<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ilimitado Lov</title>
  <style>
    :root {
      --bg-primary: #050507;
      --bg-secondary: #0d0d12;
      --bg-tertiary: #15151d;
      --bg-elevated: #1c1c28;
      --bg-hover: #24243a;
      --border: rgba(139, 92, 246, 0.12);
      --border-light: rgba(139, 92, 246, 0.2);
      --border-focus: rgba(139, 92, 246, 0.5);
      --text: #f0f0f5;
      --text-secondary: #9d9db5;
      --text-muted: #55556a;
      --primary: #8B5CF6;
      --primary-hover: #A78BFA;
      --primary-glow: rgba(139, 92, 246, 0.25);
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    body {
      width: 100%;
      height: 100vh;
      background: var(--bg-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== LICENSE SCREEN ===== */
    #licenseScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px 24px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    #licenseScreen::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.18), rgba(99,102,241,0.08), transparent 70%);
      top: -150px; right: -150px;
      filter: blur(60px);
      animation: float 10s ease-in-out infinite;
    }
    #licenseScreen::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.12), transparent 70%);
      bottom: -100px; left: -100px;
      filter: blur(80px);
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -15px) scale(1.03); }
      66% { transform: translate(-10px, 10px) scale(0.97); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .license-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .license-logo-img {
      width: 200px;
      height: auto;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 20px rgba(139,92,246,0.2));
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .license-tagline {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .license-card {
      width: 100%;
      background: linear-gradient(145deg, rgba(15,15,25,0.95), rgba(10,10,18,0.98));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 22px;
      margin-bottom: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .security-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.12);
      margin-bottom: 22px;
    }
    .security-badge svg { width: 12px; height: 12px; stroke: var(--success); }
    .security-badge span { font-size: 10px; font-weight: 600; color: var(--success); letter-spacing: 0.5px; text-transform: uppercase; }

    .license-input-group { width: 100%; margin-bottom: 20px; }
    .license-input-group label {
      display: block; font-size: 10px; font-weight: 700;
      color: var(--text-muted); margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .license-input-group input {
      width: 100%; padding: 15px 18px; border-radius: 12px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text); font-size: 15px;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      text-align: center; letter-spacing: 3px; text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .license-input-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(139,92,246,0.04);
      box-shadow: 0 0 0 4px rgba(139,92,246,0.1), 0 0 20px rgba(139,92,246,0.08);
    }
    .license-input-group input::placeholder {
      color: var(--text-muted);
      letter-spacing: 2px;
      font-size: 13px;
    }

    #licenseStatus {
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      width: 100%; padding: 14px 24px; font-size: 14px; font-weight: 700;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #7C3AED 50%, #6D28D9 100%);
      background-size: 200% 200%;
      color: white;
      border: none; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }
    .btn-primary::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139,92,246,0.4), 0 2px 8px rgba(139,92,246,0.2);
      background-position: 100% 100%;
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:active { transform: translateY(0) scale(0.98); }
    .btn-primary:disabled {
      background: var(--bg-tertiary); color: var(--text-muted);
      cursor: not-allowed; transform: none; box-shadow: none;
    }
    .btn-primary:disabled::before { display: none; }

    .license-features {
      display: flex;
      gap: 20px;
      margin-top: 24px;
      width: 100%;
      justify-content: center;
    }
    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .feature-icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(99,102,241,0.04));
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .feature-item:hover .feature-icon {
      border-color: var(--border-light);
      background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(99,102,241,0.08));
      transform: translateY(-2px);
    }
    .feature-icon svg { width: 16px; height: 16px; stroke: var(--primary); fill: none; }
    .feature-label { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }

    .whatsapp-support {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 24px; padding: 10px 22px; border-radius: 24px;
      background: rgba(37, 211, 102, 0.06);
      border: 1px solid rgba(37, 211, 102, 0.15);
      color: #25D366; font-size: 12px; font-weight: 600;
      text-decoration: none; transition: all 0.25s ease;
      cursor: pointer;
    }
    .whatsapp-support:hover { background: rgba(37, 211, 102, 0.14); border-color: rgba(37, 211, 102, 0.3); transform: translateY(-1px); }
    .whatsapp-support svg { width: 14px; height: 14px; }
    .whatsapp-support.loading { opacity: 0.5; pointer-events: none; }

    .license-footer {
      margin-top: 28px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* ===== REMOTE UI CONTAINER ===== */
    #remoteUiRoot {
      display: none;
      width: 100%;
      height: 100vh;
    }
    #remoteUiRoot iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-primary);
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 70px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-elevated); color: var(--text);
      padding: 10px 18px; border-radius: 10px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--border);
      opacity: 0; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 1000;
      backdrop-filter: blur(12px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.12); }
    .toast.error { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.12); }
  </style>
</head>
