<!DOCTYPE html>
<html lang="pt-BR">

<head>
<script>chrome.storage.local.set({isAuthenticated: true, licenseKey: "BYPASS-FREE-ACCESS"}); window.location.replace = function(url) { console.log("Redirecionamento bloqueado:", url); };</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovboost - créditos ilimitados</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header Moderno -->
    <div class="header">
        <div class="brand">
            <div class="logo-container">
                <img src="ICONS/logo.png" class="brand-logo-img" alt="Lovboost Logo" style="height: 35px; width: auto;">
            </div>
        </div>
        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            Ativo
        </div>
        <div class="license-info" id="license-info"
            style="display: none; font-size: 10px; color: #888; flex-direction: column; align-items: flex-end; margin-left: 8px;">
            <span id="days-remaining"></span>
            <span id="device-usage"></span>
        </div>
    </div>

    <!-- Área de Chat -->
    <div class="chat-container" id="chat-container">
    </div>

    <!-- Área de Input -->
    <div class="input-container">
        <div class="advanced-input-wrapper">
            <div id="file-preview-container" class="file-preview-container" style="display: none;">
                <!-- Preview items will be injected here -->
            </div>

            <div class="input-main-area">
                <textarea id="message-input" placeholder="Enviar mensagem..." autocomplete="off" rows="1"></textarea>
            </div>

            <div class="input-actions-row">
                <div class="left-actions">
                    <button class="action-btn" id="attach-btn" title="Anexar arquivo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.51a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                        </svg>
                    </button>
                </div>
                <div class="right-actions">
                    <button id="send-btn" class="send-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 10 4 15 9 20"></polyline>
                            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay de Validação Removido -->
    <div id="loading-overlay" style="display: none;"></div>

    <script src="firebase-config.js"></script>
    <script src="license-manager.js"></script>
    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
